<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#7A2331"/>
  <title>Spiritus Sanctus — Offline</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FFFCF5;color:#201A16;font-family:Arial,sans-serif;padding:24px}
    .card{max-width:560px;width:100%;background:#fff;border:1px solid #eadfd2;border-radius:28px;padding:30px;box-shadow:0 18px 55px rgba(32,26,22,.10);text-align:center}
    img{width:92px;height:92px;border-radius:24px;margin:0 auto 18px}
    h1{font-family:Georgia,serif;font-size:32px;margin:0 0 10px}
    p{line-height:1.65;color:#655c53}
    .links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
    a{display:block;text-decoration:none;border-radius:14px;padding:13px;background:#f6efe4;color:#7A2331;font-weight:700}
    .retry{background:#7A2331;color:#fff}
    @media(max-width:480px){.links{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="card">
    <img src="assets/app-icon-192.png" alt="Spiritus Sanctus app icon"/>
    <h1>You are offline.</h1>
    <p>Spiritus Sanctus cannot reach the internet right now. Previously visited pages may still be available. Reconnect to receive the latest diocesan information and live feeds.</p>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="directory.html">Parishes</a>
      <a href="clergy-postings.html">2026 Postings</a>
      <a href="javascript:location.reload()" class="retry">Try Again</a>
    </div>
  </main>
</body>
</html>
